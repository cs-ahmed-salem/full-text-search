[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fulltext-search"
version = "0.1.0"
description = "Full-text search over arbitrary data sources"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Clearsky" }]
dependencies = [
    "dspy>=2.5",
    "grpcio>=1.62",
    "httpx>=0.27",
    "protobuf>=5.26",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.62",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/cs-ahmed-salem/full-text-search"
Repository = "https://github.com/cs-ahmed-salem/full-text-search"
Issues = "https://github.com/cs-ahmed-salem/full-text-search/issues"

[project.scripts]
fulltext-search-serve = "fulltext_search.interfaces.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fulltext_search"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fulltext_search",
    "scripts",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "performance: performance and benchmark tests",
]

[tool.coverage.run]
source = ["fulltext_search"]
branch = true
