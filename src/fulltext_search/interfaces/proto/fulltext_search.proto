syntax = "proto3";

package fulltext_search.v1;

option py_generic_services = false;

// Full-text search service exposing algorithm operations over gRPC.
service FullTextSearch {
  // Index documents into the active search algorithm.
  rpc Index(IndexRequest) returns (IndexResponse);

  // Search the index and return ranked hits.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Brute-force search the whole corpus; returns the first pageable page.
  rpc CreateFullSearch(CreateFullSearchRequest) returns (PageableSearchResponse);

  // Fetch a page from a previously created brute-force search session.
  rpc GetSearchPage(GetSearchPageRequest) returns (PageableSearchResponse);

  // Remove all indexed documents when supported by the algorithm.
  rpc Clear(ClearRequest) returns (ClearResponse);
}

message Document {
  string id = 1;
  string content = 2;
  map<string, string> metadata = 3;
}

message IndexRequest {
  repeated Document documents = 1;
}

message IndexResponse {
  int32 indexed_count = 1;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchResult {
  string document_id = 1;
  double score = 2;
  Document document = 3;
  repeated string highlights = 4;
  map<string, string> metadata = 5;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message CreateFullSearchRequest {
  string query = 1;
  int32 page = 2;  // defaults to 0 when unset
  int32 size = 3;  // defaults to 20 when unset
}

message GetSearchPageRequest {
  string session_id = 1;
  int32 page = 2;  // defaults to 0 when unset
  int32 size = 3;  // defaults to 20 when unset
}

message PageableSearchResponse {
  repeated SearchResult content = 1;
  string session_id = 2;
  int32 page = 3;
  int32 size = 4;
  int32 total_elements = 5;
  int32 total_pages = 6;
  bool last = 7;
  string rewritten_query = 8;
}

message ClearRequest {}

message ClearResponse {
  bool cleared = 1;
}
